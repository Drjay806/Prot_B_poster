# Full-knowledge-graph configuration — tuned for an 80GB GPU + 167GB system RAM runtime
# (confirmed actual specs, not the 40GB originally assumed -- see history below).
#
# Differs from default.yaml in:
#   1. gnn_edge_types: []        — disables the memory-budget whitelist. Every edge type
#                                   (Drug, Disease, Chembl, ... included) is now used for
#                                   message passing, and every node type gets a GPU-resident
#                                   input projection. This roughly doubles-to-triples the
#                                   node types CompGCN.input_projs builds versus default.yaml.
#   2. encoder.edge_chunk_size   — raised to 100,000 (was 5,000 on T4). Bigger chunks =
#                                   fewer FFT-chunk iterations per layer = faster epochs;
#                                   trivial memory cost at this GPU size.
#   3. encoder.num_layers: 3     — a 3rd hop. Was capped at 2 on a T4/40GB assumption
#                                   (gradient checkpointing holds one full node-embedding
#                                   set per layer); 80GB has real room for a 3rd. Not pushed
#                                   further than 3 -- GNNs over-smooth past a few hops
#                                   regardless of available memory, so more isn't free even
#                                   when the GPU can hold it.
#   4. pretrain.infonce_batch: 8192   — was 1024, deliberately matched to default.yaml for a
#                                   first apples-to-apples memory check. Now that the full
#                                   graph is confirmed to fit, a bigger contrastive batch
#                                   gives InfoNCE a larger in-batch negative pool per step --
#                                   directly targets "embeddings don't have enough signal
#                                   yet," not just a speed knob.
#   5. pretrain.num_negatives: 64     — was 32. More ComplEx link-prediction negatives per
#                                   positive, same rationale as infonce_batch.
#
# Run pretrain() for a real number of epochs this time, not the short memory-check pass
# used to confirm the full graph fits at all -- that earlier pass was a fit test, not a
# quality result, and shouldn't be read as one.

seed: 42

data:
  drive_root: "/content/drive/MyDrive/Poster code/prothgt/knowledge_graphs/"
  ontology: "bp"
  target_type: "GO_term_P"
  checkpoint_dir: "/content/drive/MyDrive/Poster code/checkpoints_full_graph/"

encoder:
  input_dim_protein: 1280
  input_dim_go: 200
  hidden_dim: 256
  output_dim: 256
  num_layers: 3             # raised from 2 now that an 80GB GPU has real headroom for a
                            # 3rd hop's gradient-checkpointed embedding set. See header note
                            # on over-smoothing before pushing this further.
  composition: "ccorr"
  dropout_pretrain: 0.3
  dropout_adv: 0.1
  use_residual: true
  # Empty whitelist = no filtering = every edge type in the graph is used.
  gnn_edge_types: []
  # T4 default is 5,000 (see compgcn.py _EDGE_CHUNK). Raised here for an 80GB GPU, which
  # no longer needs to ration edge-chunk memory the way default.yaml does.
  edge_chunk_size: 100000

generator:
  protein_dim: 256
  relation_dim: 256
  noise_dim: 64
  hidden_dims: [512, 512, 256]
  output_dim: 256
  negative_slope: 0.2

discriminator:
  input_dim: 512
  hidden_dims: [512, 256]
  output_dim: 1
  negative_slope: 0.2

distmult:
  hidden_dim: 256

reward:
  lambda_hier: 0.5
  curriculum_warmup_epochs: 30
  ancestor_sim_k: 8

pretrain:
  epochs: 150
  lr: 5.0e-4
  weight_decay: 1.0e-4
  num_negatives: 64          # raised from 32 -- more ComplEx negatives per positive, more
                            # signal per step, cheap on an 80GB GPU.
  infonce_temperature: 0.07
  # Raised from the default.yaml value of 1024 (sim matrix scales as S^2: ~268MB at 8192,
  # trivial here). A bigger in-batch negative pool is a direct, well-established lever for
  # stronger contrastive representations (SimCLR-style) -- not just a speed setting.
  infonce_batch: 8192
  distmult_weight: 0.5
  order_consistency_weight: 0.3
  eval_every: 10
  warmup_epochs: 10
  log_every_steps: 50

adversarial:
  epochs: 100
  batch_size: 256
  lr_encoder: 1.0e-5
  lr_generator: 1.0e-4
  lr_critic: 1.0e-4
  lr_discriminator: 1.0e-4
  n_critic: 5
  lambda_gp: 1.0
  adam_beta1: 0.0
  adam_beta2: 0.9
  grad_clip: 1.0
  eval_every: 5
  log_every_steps: 25
  negative_sampling:
    hard_neg_temperature: 0.5

rl:
  epochs: 50
  batch_size: 128
  lr_generator: 5.0e-5
  lr_encoder: 1.0e-5
  num_samples: 5
  grad_clip: 1.0
  eval_every: 3
  log_every_steps: 10

evaluation:
  threshold_steps: 100
  propagate_hierarchy: true
  score_chunk_size: 1000
  gen_weight: 0.0
  mode: "encoder"
  ensemble_alpha: 0.7
  protein_chunk_size: 64
  go_chunk_size: 512
