data:
  drive_root: "/content/drive/MyDrive/Poster code/prothgt/knowledge_graphs/"
  ontology: "bp"
  target_type: "GO_term_P"
  checkpoint_dir: "/content/drive/MyDrive/Poster code/checkpoints/"

encoder:
  input_dim_protein: 1280
  input_dim_go: 200
  hidden_dim: 256
  output_dim: 256
  num_layers: 2             # T4 14.6 GB: gradient checkpoint stores N_layers sets of
                            # full node_embs (all types × nodes × 256). 3 layers fills
                            # GPU before any chunk runs. 2 layers is the safe ceiling.
  composition: "ccorr"
  dropout_pretrain: 0.3
  dropout_adv: 0.1
  use_residual: true
  # Focused edge-type whitelist for T4 memory budget.
  # ALL edge types = gradient checkpoint stores Chembl/Disease/Drug node_embs (~2-5 GB each)
  # simultaneously for every layer.  Whitelist keeps only protein-function-relevant edges
  # (Protein↔GO, GO hierarchy, PPI, domain, pathway, orthology) — excludes large-DB types.
  # To re-enable all types, set gnn_edge_types: []  (needs >20 GB GPU).
  gnn_edge_types:
    - protein_function
    - rev_protein_function
    - function_function
    - rev_function_function
    - PPI
    - rev_PPI
    - protein_domain
    - rev_protein_domain
    - domain_function
    - rev_domain_function
    - Pathway
    - rev_Pathway
    - kegg_path_prot
    - rev_kegg_path_prot
    - Orthology
    - rev_Orthology
    - protein_ec
    - rev_protein_ec

generator:
  protein_dim: 256
  relation_dim: 256
  noise_dim: 64
  hidden_dims: [512, 512, 256]
  output_dim: 256
  negative_slope: 0.2

discriminator:
  input_dim: 512
  hidden_dims: [512, 256]
  output_dim: 1
  negative_slope: 0.2

distmult:
  hidden_dim: 256

reward:
  lambda_hier: 0.5
  curriculum_warmup_epochs: 30
  # ancestor_sim_k: how many transitive ancestors to sample per GO term in Phase 3
  # hierarchy loss.  Higher = stronger but slower per epoch (~8 is enough for signal).
  ancestor_sim_k: 8

pretrain:
  epochs: 50
  lr: 1.0e-3
  weight_decay: 1.0e-4
  # num_negatives is only for the ComplEx link-prediction auxiliary loss.
  # InfoNCE uses all S-1 in-batch GO terms as negatives automatically.
  num_negatives: 32
  infonce_temperature: 0.07       # SimCLR default; lower = sharper separation
  # infonce_batch: proteins sampled per epoch for InfoNCE [S,S] matrix.
  # Memory scales as S^2.  1024 = 4 MB sim matrix; safe on T4 with 3-layer CompGCN.
  # Reduce further (512) if OOM persists.
  infonce_batch: 1024
  distmult_weight: 0.5            # weight on the ComplEx LP loss
  # order_consistency_weight: hinge penalty when ComplEx scores parent GO lower than child.
  # Requires passing direct_parents=build_direct_parents(train_data) to pretrain().
  # Set to 0.0 to skip (saves ~100ms/epoch; costs ~0.02 Fmax).
  order_consistency_weight: 0.3
  eval_every: 10
  warmup_epochs: 10
  log_every_steps: 50

adversarial:
  epochs: 100
  batch_size: 256
  lr_encoder: 1.0e-4
  lr_generator: 1.0e-4
  lr_critic: 1.0e-4
  lr_discriminator: 1.0e-4        # kept for backward compat
  n_critic: 5                     # was 2 — 5 critic steps per generator step gives
                                  # the Lipschitz critic time to separate real from fake
                                  # before the generator is updated
  lambda_gp: 1.0                  # kept for config compat (not used with spectral norm)
  adam_beta1: 0.0                 # WGAN requires beta1=0
  adam_beta2: 0.9
  grad_clip: 1.0
  eval_every: 5
  log_every_steps: 25
  negative_sampling:
    hard_neg_temperature: 0.5     # self-adversarial sampling temperature (RotatE, Sun 2019)

rl:
  epochs: 50
  batch_size: 128
  lr_generator: 5.0e-5
  lr_encoder: 1.0e-5
  num_samples: 5
  grad_clip: 1.0
  eval_every: 3
  log_every_steps: 10

evaluation:
  threshold_steps: 100
  propagate_hierarchy: true
  score_chunk_size: 1000
  # Generator cosine contribution to encoder score.
  # Set to 0.0 for Conditions 1-4 in the ablation table (encoder/critic/ensemble modes).
  # Set to 0.3 only when you explicitly want to blend the generator into the encoder path.
  gen_weight: 0.0
  # Scoring mode for evaluate_all / evaluate_all_ontologies:
  #   "encoder"  — ComplEx score(protein, has_function, GO) [default, matches training]
  #   "critic"   — WGAN critic score(protein, GO) for all GO terms [diagnostic]
  #   "ensemble" — alpha*ComplEx + (1-alpha)*critic [tune alpha on val first]
  mode: "encoder"
  # ComplEx weight in ensemble mode (0.0 = critic only, 1.0 = ComplEx only).
  # Run tune_ensemble_alpha() on val data to set this automatically.
  ensemble_alpha: 0.7
  # Critic scoring chunk sizes (reduce if T4 OOM during mode="critic" eval).
  protein_chunk_size: 64    # proteins per outer loop in critic_score_all
  go_chunk_size: 512        # GO terms per inner loop in critic_score_all
