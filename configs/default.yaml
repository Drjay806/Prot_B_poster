data:
  drive_root: "/content/drive/MyDrive/Poster code/prothgt/knowledge_graphs/"
  ontology: "bp"
  target_type: "GO_term_P"
  checkpoint_dir: "/content/drive/MyDrive/Poster code/checkpoints/"

encoder:
  input_dim_protein: 1280
  input_dim_go: 200
  hidden_dim: 256
  output_dim: 256
  num_layers: 3             # was 2 — 3 layers gives deeper GO-hierarchy message passing
  composition: "ccorr"
  dropout_pretrain: 0.3
  dropout_adv: 0.1
  use_residual: true
  # Use ALL edge types in the knowledge graph.
  # Gradient checkpointing in CompGCN makes this memory-safe on T4.
  # Edges are processed in 50k chunks — peak memory does not grow with edge count.
  # If OOM occurs, add specific edge types here to dial back selectively.
  gnn_edge_types: []

generator:
  protein_dim: 256
  relation_dim: 256
  noise_dim: 64
  hidden_dims: [512, 512, 256]
  output_dim: 256
  negative_slope: 0.2

discriminator:
  input_dim: 512
  hidden_dims: [512, 256]
  output_dim: 1
  negative_slope: 0.2

distmult:
  hidden_dim: 256

reward:
  lambda_hier: 0.5
  curriculum_warmup_epochs: 30
  # ancestor_sim_k: how many transitive ancestors to sample per GO term in Phase 3
  # hierarchy loss.  Higher = stronger but slower per epoch (~8 is enough for signal).
  ancestor_sim_k: 8

pretrain:
  epochs: 50
  lr: 1.0e-3
  weight_decay: 1.0e-4
  # num_negatives is only for the ComplEx link-prediction auxiliary loss.
  # InfoNCE uses all S-1 in-batch GO terms as negatives automatically.
  num_negatives: 32
  infonce_temperature: 0.07       # SimCLR default; lower = sharper separation
  distmult_weight: 0.5            # weight on the ComplEx LP loss
  # order_consistency_weight: hinge penalty when ComplEx scores parent GO lower than child.
  # Requires passing direct_parents=build_direct_parents(train_data) to pretrain().
  # Set to 0.0 to skip (saves ~100ms/epoch; costs ~0.02 Fmax).
  order_consistency_weight: 0.3
  eval_every: 10
  warmup_epochs: 10
  log_every_steps: 50

adversarial:
  epochs: 100
  batch_size: 256
  lr_encoder: 1.0e-4
  lr_generator: 1.0e-4
  lr_critic: 1.0e-4
  lr_discriminator: 1.0e-4        # kept for backward compat
  n_critic: 5                     # was 2 — 5 critic steps per generator step gives
                                  # the Lipschitz critic time to separate real from fake
                                  # before the generator is updated
  lambda_gp: 1.0                  # kept for config compat (not used with spectral norm)
  adam_beta1: 0.0                 # WGAN requires beta1=0
  adam_beta2: 0.9
  grad_clip: 1.0
  eval_every: 5
  log_every_steps: 25
  negative_sampling:
    hard_neg_temperature: 0.5     # self-adversarial sampling temperature (RotatE, Sun 2019)

rl:
  epochs: 50
  batch_size: 128
  lr_generator: 5.0e-5
  lr_encoder: 1.0e-5
  num_samples: 5
  grad_clip: 1.0
  eval_every: 3
  log_every_steps: 10

evaluation:
  threshold_steps: 100
  propagate_hierarchy: true
  score_chunk_size: 1000
  # Hybrid scoring weight for generator output.
  # Final score = (1 - gen_weight)*ComplEx_score + gen_weight*generator_cosine
  # Set to 0.0 for encoder-only ablation (ComplEx only, no generator).
  # Set to 0.3 for normal use after Phase 3 completes.
  gen_weight: 0.3
